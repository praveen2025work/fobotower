[project]
name = "fobo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "langgraph>=0.2.45",
  "langgraph-checkpoint-postgres>=2.0.2",
  "psycopg[binary,pool]>=3.2",
  "duckdb>=1.1",
  "pandas>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "anyio>=4.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session. The async engine's connection pool
# binds to the loop that created it; a per-test loop leaves the pool holding
# connections on a closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
