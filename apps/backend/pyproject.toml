[project]
name = "fobo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "langgraph>=0.2.45",
  "langgraph-checkpoint-postgres>=2.0.2",
  "psycopg[binary,pool]>=3.2",
  "duckdb>=1.1",
  "pandas>=2.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "anthropic>=1.8",
  "mcp>=2.2,<3",
  "opentelemetry-api>=1.27",
  # the documents service: read PDF / Excel, write PDF reports
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "anyio>=4.4", "opentelemetry-sdk>=1.27", "claude-agent-sdk>=0.2.163"]
# Office: Phoenix tracing (PHOENIX_COLLECTOR_ENDPOINT); not needed to run Helix.
phoenix = ["arize-phoenix-otel>=0.6"]
# The office LLM path: HELIX_LLM_ADAPTER=agent_sdk.
agent-sdk = ["claude-agent-sdk>=0.2.163"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session. The async engine's connection pool
# binds to the loop that created it; a per-test loop leaves the pool holding
# connections on a closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fobo*", "seed_data*", "helix*"]
