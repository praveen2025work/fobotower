<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Agent One Finance snapshot</title>
    <script>
      // Apply the saved theme (light by default) before the first paint — see src/theme.ts.
      (function () {
        var t = null;
        try { t = localStorage.getItem("aof.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body class="bg-surface-50 text-surface-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/snapshot/main.tsx"></script>
  </body>
</html>
