# FOBO as a skill session: the simplest way to run a skill on Agent One Finance.
#
# MB Rec's end-of-day event opens a case for a book and COB. ONE step, `agent`,
# gives the model the FOBO skill (read from skills/fobo-investigation-skill.md),
# the case key and the tools below, in one session. The model reads the breaks,
# snapshots and trades itself and returns a result per break: a verdict, the
# answer in the skill's sections, and the figures it found.
#
# The platform adds the gates after `agent` (draft, validate, review, record);
# no capability can drop them. So even here:
#   - the model can call only the tools listed, through the MCP gateway: allow-list,
#     book scope, masking, an audit row per call;
#   - every figure in a result must appear in a tool result, or the break goes to a person;
#   - a controller decides every break; nothing is written to a bank system.
#
# Compare break-investigation.yaml with the FOBO groups: the same skill as rules
# in code (deterministic, cheaper), with the model for judgement only.
# MB Rec chooses which one a book uses by the capability_id in its event.

id: break.investigation.skill
name: Break investigation (skill session)
description: FOBO's skill run as one model session per book and COB, with MB Rec, MOTIF and CATS tools; a controller signs off every break.

owners:
  people: [erin]
  role: AOF_RECON_OWNER
  four_eyes: true

case:
  label: Break run
  item_label: Break
  key: [book, cob]
  subject: "{book} · COB {cob}"
  scopes: { book: book }
  opens_on: event
  events: true
  opens_as: aof-scheduler
  due: { from: cob, business_days: 1, at: "11:00", warn_hours: 2 }

items:
  id_field: instrument
  amount_field: difference
  amount_unit: GBP
  display: [instrument, isin, category, side, determinism, difference]

steps: [agent]

reasoning:
  reasoner: llm
  skill_file: skills/fobo-investigation-skill.md
  # The evidence the skill asks for (§13), as MCP tools: book status (R5), the break
  # universe, FO and BO PnL components (§5, §6), corporate actions and bond metadata
  # (FO-6, FO-7, §8 static), break history (§8 reapplication), trades (§7).
  tools: [mbrec.book_status, mbrec.breaks, mbrec.break_history, cats.pnl_components, motif.pnl_components,
          secref.corporate_actions, secref.bond_metadata, cats.trades, motif.trades, motif.booking_events]
  # The skill's verdicts (§10). The stub (no model) gives the first, so ESCALATE is first.
  verdicts: [ESCALATE, POST, DO_NOT_POST, CORRECT_AND_REPOST]
  escalate_verdicts: [ESCALATE]
  result_fields: [isin, category, side, determinism, difference]
  # The skill's required output format (§12), one section each.
  sections:
    - { id: break_summary, label: "1. Break summary", hint: "Instrument / ISIN, desk, book, date, FO value, BO value, break amount", required: true }
    - { id: checks, label: "2. Checks performed", hint: "Test ID | What was checked | Result (Pass/Fail/Unable to test) | Evidence", required: true }
    - { id: root_cause, label: "3. Root cause", hint: "Single clear statement; rank multiple causes; or say it cannot be established", required: true }
    - { id: classification, label: "4. Classification", hint: "Category code + name. Deterministic or judgement-based", required: true }
    - { id: verdict, label: "5. Verdict", hint: "POST / DO NOT POST / ESCALATE / CORRECT & RE-POST — with the reason", required: true }
    - { id: remediation, label: "6. Remediation and follow-up", hint: "Who to engage, what to raise, what preventative control to propose", required: true }
    - { id: end_state, label: "7. End-state validation", hint: "Confirm BO + Adjustments = FO, or that the investigation remains open", required: true }

review:
  roles: [FOBO_CONTROLLER]
  require_comment: [reject, escalated]

limits:
  max_cost_usd_per_case: 10
  max_cost_usd_per_day: 200

retention:
  days: 2555
