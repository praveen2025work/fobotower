# Month-end accruals for goods received but not invoiced (GRNI) — steps v2
# phase 2, accounting actions, all generic:
#   open_period   stop (to a person) if the period is closed for the entity
#   chart         the chart of accounts, a data set the journals are checked against
#   authority     the delegated authority matrix, read from the bank's own system
#   accrual       accrual = received − invoiced (derive); material only (filter)
#   entries       balanced journals per account, checked before anyone sees them
#   review        approvals per the authority matrix (amount bands, two approvers above 250k)
#   post          the ledger's own check, then posting — after a financial
#                 controller who did not review releases it; each journal once

id: fin.accruals
name: Month-end accruals
description: Goods received but not invoiced, accrued per account at month-end — period checked, balanced journals proposed, approved within delegated authority, posted to the ledger after release.

owners:
  people: [carol, bob]
  role: AOF_FIN_VARCOMM_OWNER
  four_eyes: true

case:
  label: Accruals run
  item_label: Purchase order line
  key: [entity, period]
  subject: "{entity} · {period}"
  scopes: { entity: entity }

items:
  load: { tool: journals.grni, args: { entity: $case.entity, period: $case.period } }
  id_field: po_line
  amount_field: accrual
  amount_unit: GBP
  display: [po_line, supplier, account, cost_centre, received_value, invoiced_value, accrual]

policy:
  materiality: { value: 5000, unit: GBP }

steps: [load, open_period, chart, authority, accrual, material, group, reason, entries, draft, validate, review, record, post]
pause_before: [review, post]

step_settings:
  open_period:
    type: period_check
    label: Is the period open?
    with: { tool: journals.period_status, args: { entity: $case.entity, period: $case.period } }
  chart:
    type: dataset
    label: Chart of accounts
    with: { name: chart, tool: journals.chart_of_accounts, args: { entity: $case.entity } }
  authority:
    type: dataset
    label: Delegated authority
    with: { name: authority, tool: authority.delegated_authority, args: { entity: $case.entity } }
  accrual:
    type: derive
    label: Accrual = received − invoiced
    with: { fields: { accrual: "round(received_value - invoiced_value, 2)" } }
  material:
    type: filter
    label: Material only
    with: { keep_when: "accrual >= policy.materiality", reason: below materiality }
  entries:
    type: propose_entries
    label: Accrual journals
    with:
      period: $case.period
      chart: chart
      lines:
        - { account: "{account}", side: debit, amount: "total", narrative: "GRNI accrual {account} {case_period}" }
        - { account: "2150", side: credit, amount: "total", narrative: "GRNI accrual {account} {case_period}" }
  post:
    type: post
    label: Post to the ledger
    with:
      tool: journals.post_journal
      dry_run_tool: journals.validate_journal
      args: { entity: $case.entity }
      approver_roles: [FIN_CONTROLLER]

group_by: [account]
group_label: "Account {account}"

rules:
  - id: accrue
    when: total > 0
    then:
      status: proposed
      comment: "Accrue {total} GBP on account {account} for {count} purchase order line(s) received but not invoiced."

reasoning:
  reasoner: none

review:
  roles: [FIN_PREPARER, FIN_REVIEWER]
  authority_dataset: authority

knowledge:
  entities: [account]
retention:
  days: 2555
