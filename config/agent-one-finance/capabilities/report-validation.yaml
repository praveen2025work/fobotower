# Report validation: check a management report (an Excel workbook) line by
# line against the general ledger, explain every difference, sign off, and
# publish a PDF validation report. Configuration only — the documents
# service reads the workbook and writes the PDF; the engine is the one every
# capability uses.

id: report.validation
name: Report validation
description: Check a management report (Excel) against the general ledger, explain every difference, sign off, publish a PDF validation report.

owners:
  people: [carol]
  role: AOF_FIN_VARCOMM_OWNER
  four_eyes: true

case:
  label: Validation
  item_label: Report line
  key: [entity, period, report]
  subject: "{report} · {entity} · {period}"
  scopes: { entity: entity }

items:
  id_field: item_id
  amount_field: difference
  display: [account, account_name, cost_centre, report_amount, ledger_amount, difference, break_type]

match:
  left: { tool: documents.read_workbook, args: { entity: $case.entity, name: $case.report } }
  right: { tool: gl.balances, args: { entity: $case.entity, period: $case.period } }
  keys: [account, cost_centre]
  amount_field: actual
  tolerance: 0.01
  left_label: report
  right_label: ledger

policy:
  rounding_limit: { value: 5, unit: GBP }

steps: [match, group, reason, draft, validate, review, record, publish]
pause_before: [review, publish]
group_by: [account]

rules:
  - id: rounding
    when: count == 1 and abs(total) <= policy.rounding_limit
    then:
      status: proposed
      comment: "Report differs from the ledger by {total} on account {account}: rounding, within the limit; no change."

reasoning:
  reasoner: llm
  output: commentary
  tools: [gl.journal_lines, documents.list_documents, documents.read_pdf]
  skill: |
    You validate a management report against the general ledger for a finance
    reviewer. For each account with differences, use the journal lines and the
    business's supporting documents (list them, then read the relevant PDF) to
    say why the report and the ledger differ — a timing accrual, a line
    reported in another cost centre, a missing posting — and whether the report
    or the ledger needs correcting. Cite only figures from the tools or the
    report lines. If nothing explains a difference, say so and escalate.

knowledge:
  entities: [account, cost_centre]
retention:
  days: 2555

review:
  roles: [FIN_PREPARER, FIN_REVIEWER]

# One PDF per validation, written to the entity's reports only after a
# reviewer who did not sign off the lines releases it (four-eyes).
publish:
  tool: documents.render_pdf_report
  per: case
  args:
    entity: $case.entity
    name: $case_id
    title: Report validation
    subtitle: $subject
    sections: $approved
    sign_off: $sign_off
  approver_roles: [FIN_REVIEWER]
