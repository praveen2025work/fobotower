# Office connectors — an example of config/agent-one-finance/connectors.yaml with every
# stub replaced by a real MCP server. Same ids, same tool allow-list, same
# data-scope rules; only transport, url and auth change. Capabilities do not
# change at all.
#
# Copy the entries you need into connectors.yaml (or point AOF_CONFIG_DIR at
# a folder holding your office version). Header values are read from the
# environment variable named on the right, never written here.
#
# Office platform services (RAG, data explorer, plugins' MCP servers) are
# onboarded the same way — add an entry, list the tools Agent One Finance may use — so
# every call goes through the gateway: allow-list, scope check, audit, trace.
#
# Then check the wiring: scripts/aof_office_smoke.py --user <id>

connectors:
  gl:
    name: General ledger
    transport: http
    url: https://gl-mcp.internal.example/mcp
    headers_env: { Authorization: GL_MCP_AUTHORIZATION }
    classification: internal
    tools:
      balances:      { description: "Actual and budget per account and cost centre", scope: { arg: entity, key: entity } }
      journal_lines: { description: Largest journal lines for an account,           scope: { arg: entity, key: entity } }

  cats:
    name: CATS — front-office positions
    transport: http
    url: https://cats-mcp.internal.example/mcp
    headers_env: { Authorization: CATS_MCP_AUTHORIZATION }
    classification: confidential
    tools:
      positions: { description: "End-of-day FO positions and MTM per book and COB", scope: { arg: book, key: book } }
      trades:    { description: "FO trades per book and COB (skill §7 trade level)", scope: { arg: book, key: book } }

  # MB Rec: the breaks FOBO investigates, already reconciled (break.investigation).
  mbrec:
    name: MB Rec — reconciled breaks
    transport: http
    url: https://mbrec-mcp.internal.example/mcp
    headers_env: { Authorization: MBREC_MCP_AUTHORIZATION }
    classification: confidential
    tools:
      breaks:        { description: "Open breaks MB Rec reconciled for a book and COB", scope: { arg: book, key: book } }
      break_history: { description: "The last five COBs of one instrument's break", scope: { arg: book, key: book } }
      break_history_book: { description: "The last five COBs of every open break in a book", scope: { arg: book, key: book } }
      # No book argument: the cluster step keeps only a count of other books on the case.
      breaks_all:    { description: "Open breaks in every book for one COB (book, instrument, difference)" }

  motif:
    name: MOTIF — back-office positions and events
    transport: http
    url: https://motif-mcp.internal.example/mcp
    headers_env: { Authorization: MOTIF_MCP_AUTHORIZATION }
    classification: confidential
    tools:
      positions:       { description: "End-of-day BO positions and MTM per book and COB", scope: { arg: book, key: book } }
      booking_events:  { description: "Booking and amendment events behind a book's breaks", scope: { arg: book, key: book } }
      break_snapshots: { description: "Dated FO/BO snapshots per instrument", scope: { arg: book, key: book } }
      trades:          { description: "BO trades per book and COB (skill §7 trade level)", scope: { arg: book, key: book } }

  reporting:
    name: Management reporting pack
    transport: http
    url: https://reporting-mcp.internal.example/mcp
    headers_env: { Authorization: REPORTING_MCP_AUTHORIZATION }
    classification: internal
    tools:
      publish_commentary:
        description: Publish approved variance commentary to the reporting pack
        access: write                       # publish step only, after a second person releases it
        idempotency_arg: idempotency_key    # the system must treat a repeat as the same write
        scope: { arg: entity, key: entity }

  # The documents service runs next to the team share it reads:
  #   python -m agent_one_finance.mcp_services.documents --port 9201
  documents:
    name: Documents — PDF and Excel in, PDF reports out
    transport: http
    url: https://aof-documents.internal.example/mcp
    headers_env: { Authorization: DOCUMENTS_MCP_AUTHORIZATION }
    classification: internal
    tools:
      list_documents:    { description: "PDF and Excel documents for an entity", scope: { arg: entity, key: entity } }
      read_pdf:          { description: "Text of a PDF, page by page", scope: { arg: entity, key: entity } }
      read_workbook:     { description: "Rows of one sheet of a workbook", scope: { arg: entity, key: entity } }
      render_pdf_report: { description: "Write a PDF report", access: write, idempotency_arg: idempotency_key, scope: { arg: entity, key: entity } }

  # An office RAG / data-explorer server, onboarded like any other.
  policy_rag:
    name: Accounting policy search (office RAG)
    transport: http
    url: https://agent-platform.internal.example/rag/accounting-policy/mcp
    headers_env: { Authorization: AGENT_PLATFORM_AUTHORIZATION }
    classification: internal
    tools:
      search: { description: Search accounting policy and procedure documents }

  # The team ticket queues escalations are raised in (manifest `escalation`).
  ticketing:
    name: ServiceNow — team queues
    transport: http
    url: https://servicenow-mcp.internal.example/mcp
    headers_env: { Authorization: SERVICENOW_MCP_AUTHORIZATION }
    classification: internal
    tools:
      create_ticket: { description: "Raise a ticket in a team's queue", access: write, idempotency_arg: idempotency_key }

  # Beyond finance: payments operations and reference data (payments.exceptions capability).
  refdata:
    name: Reference data
    transport: http
    url: https://refdata-mcp.internal.example/mcp
    headers_env: { Authorization: REFDATA_MCP_AUTHORIZATION }
    classification: internal
    tools:
      fx_rates: { description: "End-of-day FX rates for a date" }

  payments:
    name: Payments operations
    transport: http
    url: https://payments-ops-mcp.internal.example/mcp
    headers_env: { Authorization: PAYMENTS_MCP_AUTHORIZATION }
    classification: confidential
    tools:
      exceptions:    { description: "Payment exceptions for an entity and date", scope: { arg: entity, key: entity } }
      message_trail: { description: "ISO 20022 / SWIFT messages behind the exceptions", scope: { arg: entity, key: entity } }
      risk_score:    { description: "The payments team's own risk scoring service", scope: { arg: entity, key: entity } }

  # Steps v2: accounting actions, assurance, orchestration, parties
  # (fin.accruals, client.complaints, controls.operating-test). Each system
  # stays the source; Agent One Finance reads it, and writes only where a person approved.
  journals:
    name: General ledger — periods, accounts, journals
    transport: http
    url: https://ledger-mcp.internal.example/mcp
    headers_env: { Authorization: LEDGER_MCP_AUTHORIZATION }
    classification: confidential
    tools:
      period_status:     { description: "Whether the accounting period is open for an entity", scope: { arg: entity, key: entity } }
      chart_of_accounts: { description: "The entity's postable accounts", scope: { arg: entity, key: entity } }
      grni:              { description: "Goods received not invoiced at period end", scope: { arg: entity, key: entity } }
      validate_journal:  { description: "The ledger's own check of a journal (a dry run)", scope: { arg: entity, key: entity } }
      post_journal:
        description: Post a journal to the ledger
        access: write                    # the post step only, after a second person releases it
        idempotency_arg: idempotency_key # each journal once, however often retried
        scope: { arg: entity, key: entity }

  authority:
    name: Delegated authority
    transport: http
    url: https://doa-mcp.internal.example/mcp
    headers_env: { Authorization: DOA_MCP_AUTHORIZATION }
    classification: internal
    tools:
      # rows: min_amount, max_amount, roles, approvals, lane, bulk — read as a data set
      # (review.authority_dataset), so the bank's matrix stays the source of truth
      delegated_authority: { description: "Who may approve how much, per entity", scope: { arg: entity, key: entity } }

  channel:
    name: Client and counterparty messaging
    transport: http
    url: https://messaging-mcp.internal.example/mcp
    headers_env: { Authorization: MESSAGING_MCP_AUTHORIZATION }
    classification: confidential
    tools:
      send_message:
        description: Send a message to a client or counterparty (secure mail, portal, SWIFT MT199)
        access: write                    # an outreach step only, after a person approves sending
        idempotency_arg: idempotency_key

  client:
    name: Client service — complaints, account events, watch list
    transport: http
    url: https://client-service-mcp.internal.example/mcp
    headers_env: { Authorization: CLIENT_MCP_AUTHORIZATION }
    classification: confidential
    tools:
      complaints:     { description: "Complaints received for an entity on a date", scope: { arg: entity, key: entity } }
      account_events: { description: "Account events around a date", scope: { arg: entity, key: entity } }
      watch_list:     { description: "The team's internal watch list (supplied by the control function)" }

  procurement:
    name: Procurement — purchase orders, receipts, invoices
    transport: http
    url: https://procurement-mcp.internal.example/mcp
    headers_env: { Authorization: PROCUREMENT_MCP_AUTHORIZATION }
    classification: internal
    tools:
      purchase_orders: { description: "Purchase order lines for a period", scope: { arg: entity, key: entity } }
      goods_receipts:  { description: "Goods receipts against purchase order lines", scope: { arg: entity, key: entity } }
      invoices:        { description: "Supplier invoices against purchase order lines", scope: { arg: entity, key: entity } }

  controls:
    name: Controls testing evidence
    transport: http
    url: https://controls-mcp.internal.example/mcp
    headers_env: { Authorization: CONTROLS_MCP_AUTHORIZATION }
    classification: internal
    tools:
      evidence: { description: "Test attributes for one sampled item", scope: { arg: entity, key: entity } }
