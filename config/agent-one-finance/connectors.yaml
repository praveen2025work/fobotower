# Onboarded MCP connectors — owned by the Agent One Finance team.
#
# Each entry is one bank system exposed as an MCP server. Only tools listed
# here can be used by any capability (an allow-list); `scope` names the
# argument that carries the data scope, which the gateway checks against the
# caller's entitlements on every call.
#
# These four are stubs that run in-process (agent_one_finance/stub_connectors). In the
# office, point an entry at the real connector:
#
#   gl:
#     name: General ledger
#     transport: http
#     url: https://gl-mcp.internal.example/mcp
#     headers_env: { Authorization: GL_MCP_AUTHORIZATION }   # value read from env
#     tools: ...same allow-list...

connectors:
  gl:
    name: General ledger (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_gl
    classification: internal
    tools:
      balances:
        description: Actual and budget per account and cost centre
        scope: { arg: entity, key: entity }
      journal_lines:
        description: Largest journal lines for an account
        scope: { arg: entity, key: entity }

  budget:
    name: Budget and plan (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_budget
    classification: internal
    tools:
      plan_lines:
        description: Budget lines and planning notes for an account
        scope: { arg: entity, key: entity }

  bank:
    name: Bank statements (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_bank
    classification: confidential
    tools:
      statement:
        description: Bank statement lines for a value date
        scope: { arg: entity, key: entity }

  ledger:
    name: Ledger cash postings (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_ledger
    classification: confidential
    tools:
      postings:
        description: Ledger cash postings for a value date
        scope: { arg: entity, key: entity }
      counterparty_history:
        description: Recent settled items with a counterparty
        scope: { arg: entity, key: entity }

  reporting:
    name: Management reporting pack (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_reporting
    classification: internal
    tools:
      publish_commentary:
        description: Publish approved variance commentary to the reporting pack
        access: write          # never offered to the model; publish step only, after release
        idempotency_arg: idempotency_key   # a repeated write returns the first receipt
        scope: { arg: entity, key: entity }

  refdata:
    name: Reference data — FX rates (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_refdata
    classification: internal
    tools:
      fx_rates:
        description: End-of-day FX rates for a date (value of one unit in GBP)

  payments:
    name: Payments operations (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_payments
    classification: confidential
    tools:
      exceptions:
        description: Payment exceptions (returns, rejects, repairs) for an entity and date
        scope: { arg: entity, key: entity }
      message_trail:
        description: SWIFT / ISO 20022 messages behind the day's exceptions
        scope: { arg: entity, key: entity }
      risk_score:
        description: The payments team's own risk scoring service (0–100 and reasons per item)
        scope: { arg: entity, key: entity }

  journals:
    name: General ledger — periods, accounts, journals (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_ledger
    classification: confidential
    tools:
      period_status: { description: "Whether the accounting period is open for an entity", scope: { arg: entity, key: entity } }
      chart_of_accounts: { description: "The entity's postable accounts", scope: { arg: entity, key: entity } }
      grni: { description: "Goods received not invoiced at period end", scope: { arg: entity, key: entity } }
      validate_journal: { description: "The ledger's own check of a journal (a dry run)", scope: { arg: entity, key: entity } }
      post_journal:
        description: Post a journal to the ledger
        access: write              # the post step only, after a second person releases it
        idempotency_arg: idempotency_key
        scope: { arg: entity, key: entity }

  authority:
    name: Delegated authority (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_authority
    classification: internal
    tools:
      delegated_authority: { description: "Who may approve how much, per entity", scope: { arg: entity, key: entity } }

  channel:
    name: Client and counterparty messaging (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_channel
    classification: confidential
    tools:
      send_message:
        description: Send a message to a client or counterparty
        access: write              # an outreach step only, after a person approves sending
        idempotency_arg: idempotency_key

  client:
    name: Client service — complaints, account events, watch list (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_client
    classification: confidential
    tools:
      complaints: { description: "Complaints received for an entity on a date", scope: { arg: entity, key: entity } }
      account_events: { description: "Account events around a date", scope: { arg: entity, key: entity } }
      watch_list: { description: "The team's internal watch list" }

  procurement:
    name: Procurement — purchase orders, receipts, invoices (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_procurement
    classification: internal
    tools:
      purchase_orders: { description: "Purchase order lines for a period", scope: { arg: entity, key: entity } }
      goods_receipts: { description: "Goods receipts against purchase order lines", scope: { arg: entity, key: entity } }
      invoices: { description: "Supplier invoices against purchase order lines", scope: { arg: entity, key: entity } }

  controls:
    name: Controls testing evidence (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.banking:build_controls
    classification: internal
    tools:
      evidence: { description: "Test attributes for one sampled item", scope: { arg: entity, key: entity } }

  ticketing:
    name: Team ticket queues (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_ticketing
    classification: internal
    tools:
      create_ticket:
        description: Raise a ticket in a team's queue (ServiceNow / Jira)
        access: write          # raised by the record step after review, never by the model
        idempotency_arg: idempotency_key   # one ticket per case and group, however often retried

  cats:
    name: CATS — front-office positions (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_cats
    classification: confidential
    tools:
      positions:
        description: End-of-day FO positions and MTM per book and COB
        scope: { arg: book, key: book }
      trades:
        description: FO trades per book and COB (quantity, direction, consideration, price, pull factor, settlement)
        scope: { arg: book, key: book }

  mbrec:
    name: MB Rec — reconciled breaks (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_mbrec
    classification: confidential
    tools:
      breaks:
        description: Open breaks MB Rec reconciled for a book and COB (CATS vs MOTIF, difference, type, days open)
        scope: { arg: book, key: book }
      break_history:
        description: The last five COBs of one instrument's break (open or cleared)
        scope: { arg: book, key: book }

  motif:
    name: MOTIF — back-office positions and events (stub)
    transport: inproc
    target: agent_one_finance.stub_connectors.finance:build_motif
    classification: confidential
    tools:
      positions:
        description: End-of-day BO positions and MTM per book and COB
        scope: { arg: book, key: book }
      booking_events:
        description: Booking and amendment events behind a book's breaks
        scope: { arg: book, key: book }
      break_snapshots:
        description: Dated FO/BO snapshots per instrument (booking time, mapping, curves, components, versions, adjustments)
        scope: { arg: book, key: book }
      trades:
        description: BO trades per book and COB (quantity, direction, consideration, price, pull factor, settlement)
        scope: { arg: book, key: book }

  # An Agent One Finance-provided service, not a stub: reads PDF and Excel files and writes
  # PDF reports (agent_one_finance/mcp_services/documents.py). Files are kept per entity;
  # in the office, serve it over http next to the team share it reads.
  documents:
    name: Documents — PDF and Excel in, PDF reports out
    transport: inproc
    target: agent_one_finance.mcp_services.documents:build_documents
    classification: internal
    tools:
      list_documents:
        description: PDF and Excel documents available for an entity
        scope: { arg: entity, key: entity }
      read_pdf:
        description: Text of a PDF, page by page
        scope: { arg: entity, key: entity }
      read_workbook:
        description: Rows of one sheet of an Excel workbook, keyed by its header row
        scope: { arg: entity, key: entity }
      render_pdf_report:
        description: Write a PDF report (sections, tables, sign-off) to the entity's reports
        access: write          # publish step only, after a second person releases the case
        idempotency_arg: idempotency_key
        scope: { arg: entity, key: entity }
