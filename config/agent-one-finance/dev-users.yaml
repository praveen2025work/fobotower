# Development stand-in for the central entitlements system.
# Used only when AOF_ENTITLEMENT_URL is unset. Same shape the real
# service is asked for: roles, and data scopes per dimension ("*" = all).

users:
  alice:
    name: Alice (Finance preparer, UK)
    roles: [FIN_PREPARER]
    data_scopes: { entity: [UK01] }
  bob:
    name: Bob (Finance reviewer, all entities)
    roles: [FIN_REVIEWER, AOF_FIN_VARCOMM_OWNER]
    data_scopes: { entity: ["*"] }
  carol:
    name: Carol (Finance capability owner)
    roles: [AOF_FIN_VARCOMM_OWNER]
    data_scopes: { entity: ["*"] }
  dan:
    name: Dan (Cash operations, UK and US)
    roles: [CASH_OPS, AOF_CASH_RECON_OWNER]
    data_scopes: { entity: [UK01, US01] }
  erin:
    name: Erin (Cash operations; owner of the recon capability)
    roles: [CASH_OPS, AOF_CASH_RECON_OWNER, AOF_RECON_OWNER]
    data_scopes: { entity: ["*"] }
  frank:
    name: Frank (FOBO controller, all books; CATS vs MOTIF owner)
    roles: [FOBO_CONTROLLER, AOF_FOBO_RECON_OWNER]
    data_scopes: { book: ["*"] }
  tom:
    name: Tom (Prime desk trader; answers controllers' questions)
    roles: [PRIME_DESK]
    data_scopes: {}
  ravi:
    name: Ravi (Rates desk trader; answers controllers' questions)
    roles: [RATES_DESK]
    data_scopes: {}
  olga:
    name: Olga (Operations, MOTIF postings)
    roles: [FOBO_OPERATIONS]
    data_scopes: {}
  gina:
    name: Gina (FOBO controller, PRIME-MB-01; CATS vs MOTIF owner)
    roles: [FOBO_CONTROLLER, AOF_FOBO_RECON_OWNER]
    data_scopes: { book: [PRIME-MB-01] }
  rita:
    name: Rita (FOBO Rates controller, London books; CATS vs MOTIF Rates owner)
    roles: [FOBO_RATES_CONTROLLER, AOF_FOBO_RATES_OWNER]
    data_scopes: { book: [RATES-LDN-01, RATES-LDN-02, RATES-LDN-03, RATES-LDN-04] }
  raj:
    name: Raj (FOBO Rates controller, all Rates books; CATS vs MOTIF Rates owner)
    roles: [FOBO_RATES_CONTROLLER, AOF_FOBO_RATES_OWNER]
    data_scopes: { book: [RATES-LDN-01, RATES-LDN-02, RATES-LDN-03, RATES-LDN-04, RATES-NY-01, RATES-NY-02] }
  paula:
    name: Paula (Payments Operations lead; payment exceptions owner)
    roles: [PAYMENTS_OPS, PAYMENTS_LEAD, AOF_PAYMENTS_OWNER]
    data_scopes: { entity: ["*"] }
  pete:
    name: Pete (Payments Operations; payment exceptions owner)
    roles: [PAYMENTS_OPS, AOF_PAYMENTS_OWNER]
    data_scopes: { entity: [UK01] }
  rhea:
    name: Rhea (Finance reviewer, second approver)
    roles: [FIN_REVIEWER]
    data_scopes: { entity: ["*"] }
  fiona:
    name: Fiona (Financial controller; releases journals to the ledger)
    roles: [FIN_CONTROLLER]
    data_scopes: { entity: ["*"] }
  carla:
    name: Carla (Complaints handler)
    roles: [COMPLAINTS_HANDLER, AOF_COMPLAINTS_OWNER]
    data_scopes: { entity: ["*"] }
  lena:
    name: Lena (Complaints lead; redress above the limit)
    roles: [COMPLAINTS_HANDLER, COMPLAINTS_LEAD, AOF_COMPLAINTS_OWNER]
    data_scopes: { entity: ["*"] }
  tess:
    name: Tess (Controls tester)
    roles: [CONTROL_TESTER, AOF_CONTROLS_OWNER]
    data_scopes: { entity: ["*"] }
  owen:
    name: Owen (Control owner; attests the control)
    roles: [CONTROL_OWNER, CONTROL_TESTER, AOF_CONTROLS_OWNER]
    data_scopes: { entity: ["*"] }
  dana:
    name: Dana (Head of Finance Operations; demo view across every team)
    roles: [FIN_REVIEWER, FIN_CONTROLLER, CASH_OPS, FOBO_CONTROLLER, FOBO_RATES_CONTROLLER, PAYMENTS_OPS, PAYMENTS_LEAD,
            COMPLAINTS_LEAD, CONTROL_OWNER, AOF_FIN_VARCOMM_OWNER, AOF_CASH_RECON_OWNER, AOF_RECON_OWNER,
            AOF_FOBO_RECON_OWNER, AOF_FOBO_RATES_OWNER, AOF_PAYMENTS_OWNER, AOF_COMPLAINTS_OWNER, AOF_CONTROLS_OWNER]
    data_scopes: { entity: ["*"], book: ["*"] }
  pat:
    name: Pat (Agent One Finance platform support — switches, connectors; sees no case data)
    roles: [AOF_PLATFORM_ADMIN]
    data_scopes: {}
  aof-scheduler:
    name: Agent One Finance scheduler (service account — opens scheduled and event cases, never decides)
    roles: [FIN_PREPARER, CASH_OPS, FOBO_CONTROLLER, FOBO_RATES_CONTROLLER, PAYMENTS_OPS, COMPLAINTS_HANDLER, CONTROL_TESTER]
    data_scopes: { entity: ["*"], book: ["*"] }
  viewer:
    name: Viewer (no Agent One Finance roles)
    roles: []
    data_scopes: {}
