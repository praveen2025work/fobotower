# FOBO reference lineage — the facts FOBO's own knowledge graph holds
# (apps/backend/seed_data/loader.py) for the Prime books, plus the Rates books
# (London and New York desks): which desk each book belongs to,
# and which team each desk escalates to. Bitemporal: a change closes the old
# edge (valid_to, exclusive) and opens a new one (valid_from) — PRIME-MB-05
# moved from APAC-TREASURY to APAC-CASH on 2026-07-01, so a task for a COB
# before that date resolves the old desk.
#
# Read by the `resolve` step of agents whose `knowledge.reference` is
# this namespace (the CATS vs MOTIF rec group). Loaded at startup; a new
# version of a fact is a new entry with its own valid_from.

