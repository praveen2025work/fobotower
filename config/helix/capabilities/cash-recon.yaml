# The same platform, a different shape of work: a two-sided reconciliation of
# the bank statement against ledger cash postings. Still configuration only.

id: cash.bank-vs-ledger
name: Cash — bank vs ledger
description: Daily match of bank statement lines to ledger cash postings, per entity.

owners:
  people: [erin]
  role: HELIX_CASH_RECON_OWNER
  four_eyes: true

case:
  label: Rec run
  item_label: Break
  key: [entity, date]
  subject: "{entity} · {date}"
  scopes: { entity: entity }

items:
  id_field: ref
  amount_field: difference
  display: [ref, counterparty, break_type, bank_amount, ledger_amount, difference]

match:
  left: { tool: bank.statement, args: { entity: $case.entity, date: $case.date } }
  right: { tool: ledger.postings, args: { entity: $case.entity, date: $case.date } }
  keys: [ref]
  amount_field: amount
  tolerance: 0.01
  left_label: bank
  right_label: ledger

policy:
  write_off_limit: { value: 100, unit: GBP }

steps: [match, group, reason, draft, validate, review, record]
group_by: [counterparty]

rules:
  - id: small-single-break
    when: count == 1 and abs(total) <= policy.write_off_limit
    then:
      status: proposed
      comment: "One difference of {total} with {counterparty}, within the write-off limit; propose write-off."

reasoning:
  reasoner: llm
  output: verdict
  tools: [ledger.counterparty_history]
  skill: |
    You investigate cash breaks between the bank statement and the ledger.
    Use the counterparty's settlement history to propose a likely cause and
    next action. Cite only figures from the tools or the breaks.

review:
  roles: [CASH_OPS]
