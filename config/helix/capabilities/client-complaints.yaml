# Complaint handling — steps v2 phases 4 and 6, banking beyond finance:
#   events        one timeline of the account's events (for the handler and the model)
#   related       earlier complaints from the same client, and how they ended
#   sla           the final-response clock: 8 weeks (40 business days) from receipt
#   fee_check     recompute the fee from the tariff and compare with what was charged
#   watch/screen  candidate matches against the team's internal watch list (never cleared by Agent One Finance)
#   ack/send_ack  an acknowledgement drafted per topic, sent once a handler approves sending
#   boundaries    redress above the handler's limit is reserved for the complaints lead
# The handler decides; the lead decides redress above the limit.

id: client.complaints
name: Complaint handling
description: Complaints triaged per entity and day — account timeline, related complaints, the 8-week final-response clock, fees recomputed from the tariff, acknowledgements sent after approval, redress above the limit reserved for the lead.

owners:
  people: [carla, lena]
  role: HELIX_COMPLAINTS_OWNER
  four_eyes: true

case:
  label: Complaints day
  item_label: Complaint
  key: [entity, date]
  subject: "{entity} · {date}"
  scopes: { entity: entity }

items:
  load: { tool: client.complaints, args: { entity: $case.entity, date: $case.date } }
  id_field: complaint_id
  amount_field: claimed
  amount_unit: GBP
  display: [complaint_id, client, topic, summary, claimed, fee_charged, fee_correct, clock_final_response_state, related_count]

policy:
  redress_limit: { value: 1000, unit: GBP }

steps: [load, events, related, sla, fee_check, watch, screen_names, group, reason, ack, send_ack, draft, validate, review, record]
pause_before: [send_ack, review]

step_settings:
  events:
    type: timeline
    label: Account timeline
    with:
      sources: [{ tool: client.account_events, args: { entity: $case.entity, date: $case.date }, time_field: at, label: account }]
  related:
    type: link
    label: Earlier complaints
    with: { match_on: [client], lookback_days: 365, capabilities: [client.complaints] }
  sla:
    type: clock
    label: Final response
    with:
      clocks: [{ id: final_response, label: "Final response (8 weeks)", starts: received_at, business_days: 40, warn_before_hours: 120 }]
  fee_check:
    type: recompute
    label: Fee per the tariff
    with: { formula: fee_tariff, compare_to: fee_charged, as: fee_correct, tolerance: 0 }
  watch:
    type: dataset
    label: Internal watch list
    with: { name: watch, tool: client.watch_list }
  screen_names:
    type: screen
    label: Watch list candidates
    with: { list: watch, fields: [client], threshold: 0.8 }
  ack:
    type: compose
    label: Acknowledgement
    with:
      when: "count > 0"
      to: "complainants: {topic}"
      subject: "We have received your complaint ({topic})"
      body: "Thank you for telling us. We are looking into {count} complaint(s) about {topic} and will reply in full within 8 weeks."
  send_ack:
    type: outreach
    label: Send acknowledgements
    with: { tool: channel.send_message, roles: [COMPLAINTS_HANDLER], when: "count > 0" }

group_by: [topic]
group_label: "{topic}"

rules:
  - id: service
    when: topic == 'service'
    then:
      status: proposed
      comment: "Apologise and arrange a call back for {count} complaint(s) about service."

reasoning:
  reasoner: llm
  output: verdict
  tools: [client.account_events]
  skill: |
    You help complaints handlers. For each group of complaints, use the account
    events and the recomputed fees to say what happened and propose a fair
    outcome and redress. Cite only figures from the tools or the complaints.
    You never decide redress: a handler does, and the lead above the limit.

boundaries:
  - when: "total > policy.redress_limit"
    roles: [COMPLAINTS_LEAD]
    model_may_propose: true
    reason: redress above the handler's limit

review:
  roles: [COMPLAINTS_HANDLER]

retention:
  days: 2555
