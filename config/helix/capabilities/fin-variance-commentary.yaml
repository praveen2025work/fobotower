# A capability is configuration only. This one drafts month-end P&L variance
# commentary: load balances from the GL, compute variance to budget, keep the
# material lines, group by account, settle FX revaluation by rule, ask the
# model (with GL and budget tools) for the rest, validate every figure, then
# wait for a reviewer.

id: fin.variance-commentary
name: P&L variance commentary
description: Month-end commentary on material variances to budget, per entity.

owners:
  people: [carol]
  role: HELIX_FIN_VARCOMM_OWNER
  four_eyes: true

case:
  label: Lane
  item_label: Variance line
  key: [entity, period]
  subject: "{entity} · {period}"
  scopes: { entity: entity }
  # Month-end: at 07:00 on the 2nd, open last month's lane for each entity.
  opens_on: schedule
  schedule: "0 7 2 * *"
  schedule_keys:
    - { entity: UK01, period: "{prev_month}" }
    - { entity: US01, period: "{prev_month}" }
  opens_as: helix-scheduler

items:
  load:
    tool: gl.balances
    args: { entity: $case.entity, period: $case.period }
  id_field: line_id
  amount_field: variance
  display: [account, account_name, cost_centre, actual, budget, variance]
  in_scope: abs(variance) >= policy.materiality

compare: { measure: actual, baseline: budget, as: variance }

policy:
  materiality: { value: 50000, unit: GBP }

steps: [load, compare, group, reason, draft, validate, review, record, publish]
pause_before: [review, publish]
group_by: [account]

rules:
  - id: fx-reval
    when: startswith(account, '71')
    then:
      status: proposed
      comment: "Account {account}: net {total} from period-end FX revaluation; standard treatment, no action."

reasoning:
  reasoner: llm
  output: commentary
  tools: [gl.journal_lines, budget.plan_lines]
  skill: |
    You explain month-end P&L variances to budget for a finance reviewer.
    For each account, use the journal lines and budget notes to say what
    drove the variance. Cite only figures returned by the tools or present
    in the items. Do not estimate. If the evidence does not explain the
    variance, say so and escalate.
  # Commentary in parts a reviewer can check and the reporting pack can use.
  sections:
    - { id: driver, label: What drove it,
        hint: "The journals or plan changes behind the variance, with their figures" }
    - { id: one_off, label: One-off or recurring,
        hint: "Whether it reverses next period, and the evidence" }
    - { id: action, label: Action,
        hint: "Anything finance must do: an accrual, a reclass, a forecast change; or none" }

# Decisions link to the accounts and cost centres they concern, so priors also
# come from related accounts; finished cases are kept seven years.
# Model spend: over a limit, groups go to a person instead of the model.
limits:
  max_cost_usd_per_case: 5
  max_cost_usd_per_day: 50

knowledge:
  entities: [account, cost_centre]
retention:
  days: 2555

review:
  roles: [FIN_PREPARER, FIN_REVIEWER]
  # Before approving commentary for the reporting pack. Answered and kept on
  # the decision; not required (required: true would make them a condition).
  checklist:
    - { id: driver_evidenced, label: "Is the driver evidenced by journals or the plan?", prefill: driver, required: false }
    - { id: reversal, label: "Is it clear whether it reverses next period?", prefill: one_off, required: false }
    - { id: action_owned, label: "Does any action have an owner?", prefill: action, required: false }

# Write-back: approved commentary goes to the reporting pack only after a
# reviewer who did not sign off the lane releases it (four-eyes).
publish:
  tool: reporting.publish_commentary
  args: { entity: $case.entity, period: $case.period, account: $group.account, commentary: $comment }
  approver_roles: [FIN_REVIEWER]
