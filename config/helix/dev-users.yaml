# Development stand-in for the central entitlements system.
# Used only when HELIX_ENTITLEMENT_URL is unset. Same shape the real
# service is asked for: roles, and data scopes per dimension ("*" = all).

users:
  alice:
    name: Alice (Finance preparer, UK)
    roles: [FIN_PREPARER]
    data_scopes: { entity: [UK01] }
  bob:
    name: Bob (Finance reviewer, all entities)
    roles: [FIN_REVIEWER, HELIX_FIN_VARCOMM_OWNER]
    data_scopes: { entity: ["*"] }
  carol:
    name: Carol (Finance capability owner)
    roles: [HELIX_FIN_VARCOMM_OWNER]
    data_scopes: { entity: ["*"] }
  dan:
    name: Dan (Cash operations, UK and US)
    roles: [CASH_OPS, HELIX_CASH_RECON_OWNER]
    data_scopes: { entity: [UK01, US01] }
  erin:
    name: Erin (Cash operations; owner of the recon capability)
    roles: [CASH_OPS, HELIX_CASH_RECON_OWNER, HELIX_RECON_OWNER]
    data_scopes: { entity: ["*"] }
  frank:
    name: Frank (FOBO controller, all books; CATS vs MOTIF owner)
    roles: [FOBO_CONTROLLER, HELIX_FOBO_RECON_OWNER]
    data_scopes: { book: ["*"] }
  gina:
    name: Gina (FOBO controller, PRIME-MB-01; CATS vs MOTIF owner)
    roles: [FOBO_CONTROLLER, HELIX_FOBO_RECON_OWNER]
    data_scopes: { book: [PRIME-MB-01] }
  pat:
    name: Pat (Helix platform support — switches, connectors; sees no case data)
    roles: [HELIX_PLATFORM_ADMIN]
    data_scopes: {}
  helix-scheduler:
    name: Helix scheduler (service account — opens scheduled and event cases, never decides)
    roles: [FIN_PREPARER, CASH_OPS, FOBO_CONTROLLER]
    data_scopes: { entity: ["*"], book: ["*"] }
  viewer:
    name: Viewer (no Helix roles)
    roles: []
    data_scopes: {}
