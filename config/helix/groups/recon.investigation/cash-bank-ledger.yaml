# Cash operations' rec group: bank statement vs ledger cash postings.
# It keeps the capability's defaults and sets only its own write-off limit.
group: cash-bank-ledger
name: Cash — bank vs ledger
description: Daily bank statement lines matched to ledger cash postings, per entity.
owners:
  people: [dan]
  role: HELIX_CASH_RECON_OWNER
  four_eyes: true
set:
  policy:
    write_off_limit: { value: 100, unit: GBP }
  # Follow-through: each approved break is checked on the next day's run for
  # the entity. A break that is gone has cleared; one still on the statement
  # after it was written off is not written off twice — it goes to a person.
  follow_through:
    series: [entity]
    order_by: date
  rules:
    - id: written-off-still-open
      when: carried > 0
      then:
        status: escalated
        comment: "{carried} of these breaks were decided on an earlier day and are still open; check the earlier action before writing off again."
        reason: STILL_OPEN_AFTER_DECISION
    - id: small-single-break
      when: count == 1 and abs(total) <= policy.write_off_limit
      then:
        status: proposed
        comment: "One difference of {total} with {counterparty}, within the write-off limit; propose write-off."
  # Before approving: the write-off policy's two questions.
  review:
    roles: [CASH_OPS]
    checklist:
      - { id: within_limit, label: "Is each write-off within the limit and the policy?", prefill: verdict, required: false }
      - { id: counterparty_told, label: "Has the counterparty been contacted where the bank is short?", required: false }
