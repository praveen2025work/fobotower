:"UTC"}]},"/api/authoring/templates":{"status":200,"body":[{"id":"attestation","name":"Close sign-off and attestation (template)","description":"Check every close control's evidence, explain exceptions, owners attest, publish the attestation.","yaml":"# Template — close sign-off & attestation: each close control's evidence is\\n# checked, exceptions are explained, owners attest, and an attestation PDF is\\n# published. \`controls.checklist\` is a placeholder: onboard your close-controls\\n# connector (or point the load at an existing tool) and the validator will pass.\\nid: team.close-attestation\\nname: Close sign-off and attestation (template)\\ndescription: Check every close control's evidence, explain exceptions, owners attest, publish the attestation.\\nowners: { people: [], role: YOUR_OWNER_ROLE, four_eyes: true }\\ncase:\\n  label: Close\\n  item_label: Control\\n  key: [entity, period]\\n  subject: \\"{entity} close · {period}\\"\\n  scopes: { entity: entity }\\n  opens_on: schedule\\n  schedule: \\"0 8 3 * *\\"\\n  schedule_keys: [{ entity: YOUR_ENTITY, period: \\"{prev_month}\\" }]\\n  opens_as: YOUR_SERVICE_ACCOUNT\\nitems:\\n  load: { tool: controls.checklist, args: { entity: $case.entity, period: $case.period } }\\n  id_field: control_id\\n  display: [control_id, control, owner, status, evidence]\\n  in_scope: status != 'passed'\\nsteps: [load, group, reason, draft, validate, review, record, publish]\\npause_before: [review, publish]\\ngroup_by: [owner]\\nrules:\\n  - id: evidence-missing\\n    when: count >= 1\\n    then: { status: escalated, comment: \\"{count} control(s) without passing evidence for {owner}.\\", reason: EVIDENCE_MISSING }\\nreasoning: { reasoner: none }\\nreview: { roles: [YOUR_CONTROL_OWNER_ROLE] }\\npublish:\\n  tool: documents.render_pdf_report\\n  per: case\\n  args: { entity: $case.entity, name: $case_id, title: Close attestation, subtitle: $subject,\\n          sections: $approved, sign_off: $sign_off }\\n  approver_roles: [YOUR_FINANCIAL_CONTROLLER_ROLE]\\nretention: { days: 2555 }\\n"},{"id":"commentary","name":"Variance commentary (template)","description":"Commentary on material variances to plan, written back after a four-eyes release.","yaml":"# Template — variance commentary: load actuals and plan, keep the material lines,\\n# explain each, sign off, publish to the reporting pack after a second release.\\nid: team.variance-commentary\\nname: Variance commentary (template)\\ndescription: Commentary on material variances to plan, written back after a four-eyes release.\\nowners: { people: [], role: YOUR_OWNER_ROLE, four_eyes: true }\\ncase:\\n  label: Lane\\n  item_label: Variance line\\n  key: [entity, period]\\n  subject: \\"{entity} · {period}\\"\\n  scopes: { entity: entity }\\nitems:\\n  load: { tool: gl.balances, args: { entity: $case.entity, period: $case.period } }\\n  id_field: line_id\\n  amount_field: variance\\n  display: [account, account_name, cost_centre, actual, budget, variance]\\n  in_scope: abs(variance) >= policy.materiality\\ncompare: { measure: actual, baseline: budget, as: variance }\\npolicy:\\n  materiality: { value: 50000, unit: GBP }\\nsteps: [load, compare, group, reason, draft, validate, review, record, publish]\\npause_before: [review, publish]\\ngroup_by: [account]\\nreasoning:\\n  reasoner: llm\\n  output: commentary\\n  tools: [gl.journal_lines, budget.plan_lines]\\n  skill: |\\n    Explain each material variance to plan for a finance reviewer from the\\n    journal lines and plan notes. Cite only figures from the tools or the lines.\\nreview: { roles: [YOUR_PREPARER_ROLE, YOUR_REVIEWER_ROLE] }\\npublish:\\n  tool: reporting.publish_commentary\\n  args: { entity: $case.entity, period: $case.period, account: $group.account, commentary: $comment }\\n  approver_roles: [YOUR_REVIEWER_ROLE]\\nlimits: { max_cost_usd_per_case: 5 }\\nretention: { days: 2555 }\\n"},{"id":"reconciliation","name":"Reconciliation (template)","description":"Match two systems on a key, explain every break with rules then the model, sign off.","yaml":"# Template — reconciliation: match two systems, explain every break, sign off.\\n# Replace the ids, tools, keys and roles; the validator lists anything left.\\nid: team.reconciliation\\nname: Reconciliation (template)\\ndescription: Match two systems on a key, explain every break with rules then the model, sign off.\\nowners: { people: [], role: YOUR_OWNER_ROLE, four_eyes: true }\\ncase:\\n  label: Rec run\\n  item_label: Break\\n  key: [entity, date]\\n  subject: \\"{entity} · {date}\\"\\n  scopes: { entity: entity }\\nitems:\\n  id_field: item_id\\n  amount_field: difference\\n  display: [ref, break_type, left_amount, right_amount, difference]\\nmatch:\\n  left: { tool: bank.statement, args: { entity: $case.entity, date: $case.date } }\\n  right: { tool: ledger.postings, args: { entity: $case.entity, date: $case.date } }\\n  keys: [ref]\\n  amount_field: amount\\n  tolerance: 0.01\\n  left_label: left\\n  right_label: right\\npolicy:\\n  write_off_limit: { value: 100, unit: GBP }\\nsteps: [match, group, reason, draft, validate, review, record]\\ngroup_by: [break_type]\\nrules:\\n  - id: small-break\\n    when: count == 1 and abs(total) <= policy.write_off_limit\\n    then: { status: proposed, comment: \\"One difference of {total}, within the write-off limit; propose write-off.\\" }\\nreasoning:\\n  reasoner: llm\\n  tools: [ledger.counterparty_history]\\n  skill: |\\n    You investigate reconciliation breaks between two systems. Find the likely\\n    cause of each group of breaks and the next action. Cite only figures from\\n    the tools or the breaks; escalate when nothing explains a difference.\\nreview: { roles: [YOUR_REVIEWER_ROLE] }\\nretention: { days: 2555 }\\n"},{"id":"report-validation","name":"Report validation (template)","description":"Check a management report line by line against the ledger; publish a PDF validation report.","yaml":"# Template — report validation: check a report (Excel) against the ledger and\\n# publish a PDF validation report.\\nid: team.report-validation\\nname: Report validation (template)\\ndescription: Check a management report line by line against the ledger; publish a PDF validation report.\\nowners: { people: [], role: YOUR_OWNER_ROLE, four_eyes: true }\\ncase:\\n  label: Validation\\n  item_label: Report line\\n  key: [entity, period, report]\\n  subject: \\"{report} · {entity} · {period}\\"\\n  scopes: { entity: entity }\\nitems:\\n  id_field: item_id\\n  amount_field: difference\\n  display: [account, cost_centre, report_amount, ledger_amount, difference, break_type]\\nmatch:\\n  left: { tool: documents.read_workbook, args: { entity: $case.entity, name: $case.report } }\\n  right: { tool: gl.balances, args: { entity: $case.entity, period: $case.period } }\\n  keys: [account, cost_centre]\\n  amount_field: actual\\n  tolerance: 0.01\\n  left_label: report\\n  right_label: ledger\\nsteps: [match, group, reason, draft, validate, review, record, publish]\\npause_before: [review, publish]\\ngroup_by: [account]\\nreasoning:\\n  reasoner: llm\\n  tools: [gl.journal_lines, documents.list_documents, documents.read_pdf]\\n  skill: |\\n    Say why the report and the ledger differ for each account, from the journal\\n    lines and the business's documents. Cite only figures from the tools.\\nreview: { roles: [YOUR_REVIEWER_ROLE] }\\npublish:\\n  tool: documents.render_pdf_report\\n  per: case\\n  args: { entity: $case.entity, name: $case_id, title: Report validation, subtitle: $subject,\\n          sections: $approved, sign_off: $sign_off }\\n  approver_roles: [YOUR_APPROVER_ROLE]\\n"}]},"/api/authoring/drafts":{"status":200,"body":[]},"/api/audit":{"status":200,"body":[{"kind":"tool_call","at":"2026-10-04T14:10:46.766059Z","case_id":"recon.investigation.ddfbb3d6a1f8","subject":"PRIME-MB-04 · COB 2026-09-24","capability_id":"recon.investigation","actor":"frank","requested_by":"llm","tool":"motif.booking_events","allowed":tr
