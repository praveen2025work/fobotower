# Example — a capability: month-end accruals review. Accrual accounts whose
# balance moved materially against plan are explained from their journal
# lines; a reviewer signs off. Runs on connectors that are already onboarded
# (gl, budget), so it validates and runs as is.
# Install: config/helix/capabilities/accruals-review.yaml (fresh database) or
# Authoring → paste → submit → another owner approves.
id: fin.accruals-review
name: Accruals review
description: Month-end review of material accrual movements against plan, explained from journals; release reversals after sign-off.
owners: { people: [carol], role: HELIX_FIN_VARCOMM_OWNER, four_eyes: true }
case:
  label: Accruals
  item_label: Accrual line
  key: [entity, period]
  subject: "{entity} accruals · {period}"
  scopes: { entity: entity }
  opens_on: schedule
  schedule: "0 9 3 * *"           # 09:00 on the 3rd, after close day 2
  schedule_keys: [{ entity: UK01, period: "{prev_month}" }, { entity: US01, period: "{prev_month}" }]
  opens_as: helix-scheduler
items:
  load: { tool: gl.balances, args: { entity: $case.entity, period: $case.period } }
  id_field: line_id
  amount_field: variance
  display: [account, account_name, cost_centre, actual, budget, variance]
  in_scope: (startswith(account, '6') or startswith(account, '7')) and abs(variance) >= policy.materiality
compare: { measure: actual, baseline: budget, as: variance }
policy:
  materiality: { value: 25000, unit: GBP }
steps: [load, compare, group, reason, draft, validate, review, record]
group_by: [account]
rules:
  - id: fx-reval
    when: startswith(account, '71')
    then: { status: proposed, comment: "Account {account}: {total} is FX revaluation of accrued balances; no action." }
reasoning:
  reasoner: llm
  tools: [gl.journal_lines, budget.plan_lines]
  skill: |
    You review month-end accruals. For each account, say whether the movement is a
    new accrual, a release, a reversal that did not happen, or a reclass, from the
    journal lines; flag any accrual older than three months. Cite only tool figures.
review: { roles: [FIN_PREPARER, FIN_REVIEWER], dual_review_when: "abs(total) >= 250000" }
knowledge: { entities: [account, cost_centre] }
limits: { max_cost_usd_per_case: 5, max_cost_usd_per_day: 50 }
retention: { days: 2555 }
