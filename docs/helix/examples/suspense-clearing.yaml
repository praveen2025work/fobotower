# Example — a capability: suspense account clearing. Items sitting in suspense
# are aged, matched to their likely home account, and a clearing journal is
# posted only after a reviewer approves and a second person releases it.
# Needs: `gl.suspense_items` (read) and `gl.post_journal` (access: write,
# idempotency_arg: idempotency_key) on the GL connector.
id: fin.suspense-clearing
name: Suspense account clearing
description: Suspense items aged and explained; clearing journals posted after sign-off and a four-eyes release.
owners: { people: [carol], role: HELIX_FIN_VARCOMM_OWNER, four_eyes: true }
case:
  label: Suspense run
  item_label: Suspense item
  key: [entity, date]
  subject: "{entity} suspense · {date}"
  scopes: { entity: entity }
items:
  load: { tool: gl.suspense_items, args: { entity: $case.entity, as_of: $case.date } }
  id_field: item_ref
  amount_field: amount
  display: [item_ref, booked_on, age_days, amount, narrative, suggested_account]
  in_scope: age_days >= policy.min_age_days
policy:
  min_age_days: { value: 3 }
  auto_clear_limit: { value: 500, unit: GBP }
steps: [load, group, reason, draft, validate, review, record, publish]
pause_before: [review, publish]
group_by: [suggested_account]
rules:
  - id: small-known
    when: abs(total) <= policy.auto_clear_limit and suggested_account != ''
    then: { status: proposed, comment: "{count} item(s), {total} in total, clear to {suggested_account} as suggested." }
reasoning:
  reasoner: llm
  tools: [gl.journal_lines]
  skill: |
    Find where each suspense item belongs from its narrative and the journal lines
    of the suggested account, and propose the clearing entry. Escalate anything
    you cannot place. Cite only tool figures.
review: { roles: [FIN_PREPARER, FIN_REVIEWER] }
publish:
  tool: gl.post_journal
  args: { entity: $case.entity, account: $group.suggested_account, narrative: $comment }
  approver_roles: [FIN_REVIEWER]
retention: { days: 2555 }
