# Alembic settings for the AOF database, in aos-backend next to aof_migrations/.
#   alembic -c aof_alembic.ini upgrade head
# The database address comes from AOF's own settings (AOF_DATABASE_URL, or AOF_DATABASE_HOST,
# _PORT, _NAME, _USER and _PASSWORD), not from this file.

[alembic]
script_location = %(here)s/aof_migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
